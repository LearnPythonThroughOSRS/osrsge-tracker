name: RuneLite compatibility

# The Plugin Hub rebuilds every plugin against each RuneLite release and
# silently drops any that fail to compile, so the plugin disappears from
# users' clients. This builds against the latest release daily and opens
# an issue the moment that breaks.

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin

      - name: Build and test against the latest RuneLite release
        id: build
        run: ./gradlew test --refresh-dependencies --console=plain

      - name: Report the RuneLite version that was used
        if: always()
        run: ./gradlew dependencies --configuration compileClasspath --console=plain | grep -m1 'net.runelite:client' || true

      - name: Open an issue when the build breaks
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Build fails against the latest RuneLite release';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The daily compatibility build failed, which means the Plugin Hub will drop',
              'this plugin from the current RuneLite version and it will vanish from users\' clients.',
              '',
              `Failing run: ${run}`,
              '',
              'To reproduce locally: `./gradlew test --refresh-dependencies`',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'compat',
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['compat'],
            });
